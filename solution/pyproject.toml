[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-pipeline-project-solution"
version = "0.1.0"
description = "Local-first reference implementation for the NYC Green Taxi data pipeline project."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2.2",
  "pyarrow>=16.1.0",
  "requests>=2.32.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
]
orchestration = [
  "prefect>=3.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
